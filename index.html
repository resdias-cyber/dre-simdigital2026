                font-weight: 800;
                color: #fff;
                letter-spacing: 2px;

                text-transform: uppercase;
                margin-bottom: 8px;
            }

                height: 2px;
                background: linear-gradient(90deg, #00d4aa, #a855f7);
                margin: 0 0 32px;
                border-radius: 1px;
            }
            .staticrypt-label {
                display: block;
                font-size: 10px;

                text-transform: uppercase;
                color: rgba(226,232,240,.5);
                margin-bottom: 8px;
                text-align: left;
            }
            .staticrypt-password-container {

                background: rgba(10,22,40,.6);

                box-sizing: border-box;
                transition: border-color .2s;

            .staticrypt-password-container:focus-within {
                border-color: rgba(0,212,170,.4);
            }
            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                font-family: 'Inter', sans-serif;
                color: #e2e8f0;
                outline: 0;
                padding: 14px 40px 14px 16px;
                width: 100%;
            }
            .staticrypt-form input::placeholder { color: rgba(226,232,240,.25); }

                opacity: 40%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                filter: invert(1);
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: linear-gradient(135deg, #e8461e 0%, #f5a623 100%);

                border: 0;
                border-radius: 10px;
                padding: 14px;
                color: #ffffff;
                font-size: 13px;
                font-family: 'Syne', sans-serif;
                font-weight: 700;
                letter-spacing: 2px;
                cursor: pointer;
                transition: filter .2s, transform .1s;

                border: 0;
                border-top: 1px solid rgba(30,58,95,.4);

            .staticrypt-footer {

                font-size: 9px;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: rgba(226,232,240,.25);
            }

                align-items: center;
                margin-bottom: 16px;
                cursor: pointer;
                font-size: 11px;
                color: rgba(226,232,240,.4);

                margin-right: 10px;
                accent-color: #f5a623;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {

                display: flex;
                align-items: center;
                justify-content: center;
                background: #060a12;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.2em solid rgba(0,212,170,.2);
                border-right-color: #00d4aa;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
