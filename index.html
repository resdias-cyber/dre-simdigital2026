                font-weight: 800;
                color: #fff;

                border-radius: 1px;

            .staticrypt-label {

                text-transform: uppercase;

                margin-bottom: 8px;
                text-align: left;

                transition: border-color .2s;

                border-color: rgba(0,212,170,.4);

            .staticrypt-form input[type="password"],

                outline: 0;
                padding: 14px 40px 14px 16px;
                width: 100%;

                opacity: 40%;

                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                filter: invert(1);
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;

                border-radius: 10px;
                padding: 14px;
                color: #ffffff;
                font-size: 13px;
                font-family: 'Syne', sans-serif;
                font-weight: 700;
                letter-spacing: 2px;
                cursor: pointer;
                transition: filter .2s, transform .1s;

                border: 0;
                border-top: 1px solid rgba(30,58,95,.4);

                font-size: 9px;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: rgba(226,232,240,.25);

                margin-bottom: 16px;
                cursor: pointer;
                font-size: 11px;
                color: rgba(226,232,240,.4);

                margin-right: 10px;
                accent-color: #f5a623;
            }
            .hidden { display: none !important; }

                display: flex;
                align-items: center;
                justify-content: center;
                background: #060a12;
            }
            .staticrypt-spinner {
                display: inline-block;

                border: 0.2em solid rgba(0,212,170,.2);
                border-right-color: #00d4aa;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
